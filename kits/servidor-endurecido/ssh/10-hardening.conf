# Endurecimiento de sshd. Se instala en /etc/ssh/sshd_config.d/
# Comentarios siempre en su propia línea: sshd no admite comentarios al final.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
# Solo pueden entrar los miembros de este grupo
AllowGroups ssh-users
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
